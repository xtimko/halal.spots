<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halal Spots Москва</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1d1d1f;
    --muted: #6e6e73;
    --line: #e5e5ea;
    --accent: #0a7d5a;
    --sea: #1f6fd1;
    --warn: #d9822b;
    --star: #f5a623;
    --hover: #f2f2f7;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --fg: #f2f2f7;
      --muted: #98989d;
      --line: #38383a;
      --hover: #2c2c2e;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { display: flex; height: 100%; }
  #panel { width: 340px; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--bg); z-index: 1000; }
  #map { flex: 1; }
  header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  h1 { margin: 0 0 8px; font-size: 18px; }
  h1 span { color: var(--muted); font-weight: 400; font-size: 14px; }
  #q { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--bg); color: var(--fg); font-size: 14px; }
  #list { list-style: none; margin: 0; padding: 0; overflow-y: auto; flex: 1; }
  #list li { padding: 9px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  #list li:hover { background: var(--hover); }
  #list li.missing { cursor: default; opacity: .6; }
  .row { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .name { font-weight: 600; }
  .num { color: var(--muted); font-weight: 400; margin-right: 4px; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .tag { display: inline-block; font-size: 11px; padding: 0 6px; border-radius: 6px; margin-left: 4px; color: #fff; vertical-align: 1px; }
  .tag.sea { background: var(--sea); }
  .tag.warn { background: var(--warn); }
  .stars { position: relative; display: inline-block; color: var(--line); white-space: nowrap; font-size: 13px; letter-spacing: 1px; }
  .stars::before { content: "★★★★★"; }
  .stars i { position: absolute; left: 0; top: 0; overflow: hidden; color: var(--star); font-style: normal; }
  .stars i::before { content: "★★★★★"; }
  .rating { white-space: nowrap; font-size: 12px; color: var(--muted); }
  /* балун Яндекса всегда светлый, поэтому цвета внутри него фиксированные */
  .pop { color: #1d1d1f; font-size: 13px; line-height: 1.45; }
  .pop .rating { color: #6e6e73; }
  .pop .stars { color: #e5e5ea; }
  .pop-name { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
  .pop-links { margin-top: 6px; }
  .pop-links a { color: #0a7d5a; margin-right: 10px; text-decoration: none; }
  .note { color: var(--warn); font-size: 12px; margin-top: 4px; }
  #toggle { display: none; }

  @media (max-width: 720px) {
    #app { flex-direction: column-reverse; }
    #panel { width: 100%; height: 42%; border-right: 0; border-top: 1px solid var(--line); }
    #panel.collapsed { height: auto; }
    #panel.collapsed #list { display: none; }
    #toggle { display: inline; float: right; border: 0; background: none; color: var(--accent); font-size: 14px; padding: 0; cursor: pointer; }
  }
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <header>

const TAGS = { sea: "морепрод", warn: "не всё халяль" };
const COLORS = { sea: "#1f6fd1", warn: "#d9822b" };
const GEO_CACHE = "halal-spots:geo:v1:";

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function stars(r) {
  if (r == null) return '<span class="rating">нет оценки</span>';
  const pct = Math.max(0, Math.min(100, r / 5 * 100));
  return `<span class="stars" title="${r}"><i style="width:${pct}%"></i></span> <span class="rating">${r.toFixed(1)}</span>`;
}

function tag(p) {
  return p.tag ? `<span class="tag ${p.tag}">${TAGS[p.tag]}</span>` : "";
}

function query(p) {
  return encodeURIComponent(p.addr ? `${p.name.replace(/\s*\(.*\)$/, "")} ${p.addr.replace(/\s*\(.*\)$/, "")}` : `${p.name} Москва`);
}

function popup(p) {
  const q = query(p);
  return `<div class="pop"><div class="pop-name">${esc(p.name)}${tag(p)}</div>
    <div>${esc(p.addr)}</div>
    <div>🕒 ${p.hours ? esc(p.hours) : "часы уточнить"}</div>
    <div>${stars(p.rating)}</div>
    ${p.approx ? '<div class="note">Адрес примерный — сверь на картах</div>' : ""}
    <div class="pop-links">
      <a href="https://yandex.ru/maps/213/moscow/?text=${q}" target="_blank" rel="noopener">Яндекс Карты</a>
      <a href="https://2gis.ru/moscow/search/${q}" target="_blank" rel="noopener">2ГИС</a>
    </div></div>`;
}

function cacheGet(k) {
  try { return JSON.parse(localStorage.getItem(GEO_CACHE + k)); } catch { return null; }
}
function cacheSet(k, v) {
  try { localStorage.setItem(GEO_CACHE + k, JSON.stringify(v)); } catch {}
}

// Геокодер иногда находит одноимённую улицу в другом месте — такие ответы отбрасываем.
function nearby(a, b) {
  return Math.hypot((a[0] - b[0]) * 111, (a[1] - b[1]) * 63) < 8;
}

// Несколько мест в одном доме раздвигаем, чтобы метки не накрывали друг друга.
const taken = new Map();

async function refine(p, mark) {
  if (p.geo === false) return;
  const q = p.geo || "Москва, " + p.addr.replace(/\s*\(.*\)$/, "");
  let ll = cacheGet(q);
  if (ll === null) {
    try {
      const obj = (await ymaps.geocode(q, { results: 1 })).geoObjects.get(0);
      const found = obj && obj.geometry.getCoordinates();
      ll = found && nearby(found, p.ll) ? found : false;
      cacheSet(q, ll);
    } catch { return; }
  }
  if (!ll) return;
  const key = ll.join();
  const dup = taken.get(key) || 0;
  taken.set(key, dup + 1);
  mark.geometry.setCoordinates([ll[0], ll[1] + dup * 0.0002]);
}

let map;
const marks = new Map();

ymaps.ready(async () => {
  map = new ymaps.Map("map", {
    center: [55.745, 37.58],
    zoom: 11,
    controls: ["zoomControl", "geolocationControl"],
  }, { suppressMapOpenBlock: true });

  for (const p of PLACES) {
    if (!p.ll) continue;
    const mark = new ymaps.Placemark(p.ll, {
      balloonContent: popup(p),
      hintContent: p.name,
    }, {
      preset: "islands#circleDotIcon",
      iconColor: COLORS[p.tag] || "#0a7d5a",
      opacity: p.approx ? 0.6 : 1,
    });
    map.geoObjects.add(mark);
    marks.set(p.n, mark);
  }
  for (const p of PLACES) {
    if (marks.has(p.n)) await refine(p, marks.get(p.n));
  }
});

const list = document.getElementById("list");
const panel = document.getElementById("panel");
document.getElementById("count").textContent = `· ${PLACES.length} мест`;

function render(filter) {
  const f = filter.trim().toLowerCase();
  list.innerHTML = "";
  for (const p of PLACES) {
    if (f && !`${p.name} ${p.addr || ""}`.toLowerCase().includes(f)) continue;
    const li = document.createElement("li");
    if (!p.ll) li.className = "missing";
    li.innerHTML = `<div class="row">
        <div><span class="num">${p.n}.</span><span class="name">${esc(p.name)}</span>${tag(p)}</div>
        <div>${p.ll ? stars(p.rating) : ""}</div>
      </div>
      <div class="meta">${p.ll
        ? `${esc(p.addr)}${p.hours ? " · " + esc(p.hours) : ""}`
        : `не нашёл на картах · <a href="https://yandex.ru/maps/213/moscow/?text=${query(p)}" target="_blank" rel="noopener">искать</a>`}</div>`;
    if (p.ll) {
      li.addEventListener("click", () => {
        const mark = marks.get(p.n);
        if (!mark) return;
        map.setCenter(mark.geometry.getCoordinates(), 16, { duration: 300 })
          .then(() => mark.balloon.open());
        if (window.matchMedia("(max-width: 720px)").matches) panel.classList.add("collapsed");
      });
    }
    list.appendChild(li);
  }
}

document.getElementById("q").addEventListener("input", e => {
  render(e.target.value);
  panel.classList.remove("collapsed");
});
document.getElementById("toggle").addEventListener("click", () => panel.classList.toggle("collapsed"));
render("");
</script>
</body>
</html>
